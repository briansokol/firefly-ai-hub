services:
  ai-hub:
    build:
      context: /home/bsokol/firefly-ai-hub/hub
      dockerfile: Dockerfile
    image: ai-hub:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    env_file:
      - /etc/ai-hub/hub.env
      - /etc/ai-hub/memory.env
    environment:
      - CONFIG_PATH=/app/config.toml
      - STATE_DIR=/var/lib/ai-hub
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      # Sync API for app clients. Bound to the tailscale interface IP so it is
      # reachable over the tailnet (firefly:8788) but not on 0.0.0.0 (guardrail).
      - "100.100.205.20:8788:8788"
    volumes:
      - /opt/ai-hub/config.toml:/app/config.toml:ro
      - hub-state:/var/lib/ai-hub
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/ai-hub/rgb.sock:/var/run/ai-hub/rgb.sock
      - type: bind
        source: /mnt/nas/shorts
        target: /mnt/nas/shorts
        bind:
          propagation: rslave
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Enables LiteLLM's key-management store (/key/generate). Separate DB on the
      # existing Postgres; LiteLLM runs Prisma migrations on boot.
      - DATABASE_URL=postgres://temporal:temporal@postgresql:5432/litellm
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - /etc/ai-hub/hub.env
    ports:
      - "100.100.205.20:4000:4000"
    volumes:
      - /home/bsokol/firefly-ai-hub/litellm-config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - openai-edge-tts
    env_file:
      - /etc/ai-hub/memory.env
    ports:
      - "0.0.0.0:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=en
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://openai-edge-tts:5050/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=tts-1
      - AUDIO_TTS_VOICE=en-US-AndrewNeural
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data

  openai-edge-tts:
    image: travisvn/openai-edge-tts:latest
    restart: unless-stopped
    environment:
      - API_KEY=not-needed
      - DEFAULT_VOICE=en-US-AndrewNeural
      - DEFAULT_RESPONSE_FORMAT=mp3
      - DEFAULT_SPEED=1.0

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - /etc/ai-hub/hub.env
    depends_on:
      - open-webui

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "127.0.0.1:7233:7233"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hub-state:
  open-webui:
  temporal-db:
  qdrant-data:
